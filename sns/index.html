<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>つぶやき</title>
<link rel="stylesheet" href="../sites/site.css">
<style>
:root{color:#0f1419;background:#fff;--blue:#1d9bf0;--grey:#536471;--line:#eff3f4}
body{font-size:15px;background:#fff}
.shell{display:grid;grid-template-columns:72px minmax(0,600px) 320px;justify-content:center;gap:0 24px;min-height:100vh}
.lnav{position:sticky;top:0;height:100vh;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.lnav button,.lnav .logo{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0f1419}
.lnav button:hover{background:#e7e7e8}
.lnav button.on svg{stroke-width:2.6}
.lnav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnav .logo svg{width:30px;height:30px;fill:var(--blue);stroke:none}
.lnav .post{background:var(--blue);color:#fff;margin-top:10px}
.lnav .post svg{stroke:#fff}
.lnav .me{margin-top:auto;background-size:cover;background-position:center}
.app{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.top{position:sticky;top:0;background:#fffd;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:3}
.top .bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .bar .mav{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;display:none}
.top .bar b{font-size:19px;color:#0f1419;letter-spacing:.01em}
.top .bar b svg{width:22px;height:22px;fill:var(--blue);vertical-align:-4px;margin-right:4px}
.top .bar button{margin-left:auto;font-size:14px;color:var(--grey);padding:6px 12px;border-radius:16px;background:#f2f5f7}
.search{display:none;gap:8px;padding:0 14px 10px}
.search input{flex:1;border:1px solid #e3e8eb;border-radius:20px;padding:8px 14px;font-size:14px;background:#f7f9f9}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:14px 0;font-size:15px;color:var(--grey);position:relative}
.tabs button.on{color:#0f1419;font-weight:700}
.tabs button.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:56px;height:4px;border-radius:2px;background:var(--blue)}
.compose{display:flex;gap:12px;padding:12px 16px 0;border-bottom:0}
.compose .av{flex-shrink:0}
.compose textarea{flex:1;border:0;resize:none;font:inherit;font-size:19px;min-height:60px;outline:none;padding-top:8px}
.row{display:flex;align-items:center;gap:14px;padding:4px 16px 12px 72px;border-bottom:1px solid var(--line)}
.row .tools{display:flex;gap:4px;margin-right:auto;color:var(--blue)}
.row .tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;padding:7px;box-sizing:content-box;border-radius:50%}
.row .tools svg:hover{background:#e8f5fe}
.row button{background:var(--blue);color:#fff;font-weight:700;padding:8px 18px;border-radius:20px;font-size:15px}
.row button:disabled{opacity:.5}
.post{display:flex;gap:12px;padding:12px 16px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:#f7f9f9}
.av{width:40px;height:40px;border-radius:50%;background:#ccd6dd;flex-shrink:0;background-size:cover;background-position:center}
.pic{width:100%;aspect-ratio:4/3;border-radius:16px;background-size:cover;background-position:center;border:1px solid #cfd9de;margin:6px 0 8px;position:relative}
.pic.ad{aspect-ratio:3/1}.adtag{position:absolute;right:8px;bottom:8px;font-size:14px;background:#0008;color:#fff;padding:2px 6px;border-radius:4px}
.av.mi{background-color:#dff3ee;background-size:cover;background-position:center}
.av.a{background:#e1a97a}.av.b{background:#7aa3e1}.av.c{background:#9ee17a}.av.d{background:#b07ae1}.av.e{background:#e17a7a}.av.f{background:#6c7a89}.av.me{background:#1d9bf0}
.post .body{flex:1;min-width:0}
.who{font-size:15px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;line-height:1.3}.who b{margin-right:2px}.who>span{color:var(--grey)}
.who .badge{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;align-items:center;justify-content:center;font-weight:700}
.who .more{margin-left:auto;color:var(--grey);font-size:16px;padding:0 4px}
.post p{margin:3px 0 8px;font-size:15px;line-height:1.5;white-space:pre-line;word-break:break-word}
.act{color:var(--grey);font-size:14px;display:flex;justify-content:space-between;max-width:420px;user-select:none;margin-top:2px}
.act span{display:inline-flex;gap:6px;align-items:center;padding:4px 6px;border-radius:16px}
.act span svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act span:hover{background:#eef5f9;color:var(--blue)}
.act .liked{color:#f91880}.act .liked svg{fill:#f91880;stroke:#f91880}.act .rted{color:#00ba7c}
.tag{color:var(--blue)}
.quiet{color:var(--grey);font-size:14px;text-align:center;padding:30px 16px}
.deleted{color:var(--grey);font-size:14px;padding:16px 14px;border-bottom:1px solid var(--line);background:#fafafa}
.replies{margin-left:28px;border-left:2px solid var(--line)}
.replies .post{padding-left:14px}
.profile{border-bottom:1px solid var(--line)}
.profile .cover{height:120px;background:linear-gradient(135deg,#cfd9de,#9fb3c0) center/cover}
.profile .in{padding:0 16px 16px}
.profile .av{width:80px;height:80px;margin-top:-40px;border:4px solid #fff}
.profile h2{margin:10px 0 0;font-size:20px;border:0;padding:0}
.profile .handle{color:var(--grey);font-size:14px}
.profile .bio{margin:10px 0 6px;white-space:pre-line}
.profile .meta{color:var(--grey);font-size:14px}
.profile .follow{float:right;margin-top:10px;border:1px solid #cfd9de;border-radius:20px;padding:6px 16px;font-weight:700;font-size:14px}
.back{color:#0f1419;font-size:15px;padding:12px 16px;display:flex;align-items:center;gap:20px;font-weight:700;position:sticky;top:0;background:#fffd;backdrop-filter:blur(8px);z-index:3}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.in{opacity:1}
.alert{background:#fff8f0}
/* right column */
.rcol{padding:6px 0;position:sticky;top:0;height:100vh;overflow:auto}
.rcol .sbox{display:flex;align-items:center;gap:10px;background:#eff3f4;border-radius:22px;padding:10px 16px;color:var(--grey);font-size:14px;margin:0 0 14px}
.rcol .sbox svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.rcol .card{background:#f7f9f9;border-radius:16px;padding:12px 16px 6px;margin-bottom:14px;border:0}
.rcol .card h4{margin:0 0 10px;font-size:19px}
.rcol .tr{padding:8px 0;cursor:pointer}
.rcol .tr>small{display:block;color:var(--grey);font-size:14px}
.rcol .tr>b{display:block;font-size:14px}
.rcol .tr .n{color:var(--grey);font-size:14px}
.rcol .u{display:flex;align-items:center;gap:10px;padding:8px 0}
.rcol .u .av{width:40px;height:40px}
.rcol .u b{display:block;font-size:14px;line-height:1.2}.rcol .u small{color:var(--grey);font-size:14px}
.rcol .u button{margin-left:auto;background:#0f1419;color:#fff;border-radius:16px;padding:6px 14px;font-weight:700;font-size:14px}
.rcol .foot{font-size:14px;color:var(--grey);padding:0 8px}
.fab{display:none;position:fixed;right:18px;bottom:76px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 4px 14px #0004;align-items:center;justify-content:center;z-index:5}
.fab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fffe;backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bnav button{width:52px;height:46px;display:flex;align-items:center;justify-content:center;color:#0f1419}
.bnav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on svg{stroke-width:2.8}
@media(max-width:1000px){.shell{grid-template-columns:72px minmax(0,600px)}.rcol{display:none}}
@media(max-width:700px){.shell{display:block}.lnav{display:none}.app{border:0;padding-bottom:70px}.top .bar .mav{display:block}.top .bar button{display:none}.fab{display:flex}.bnav{display:flex}.search{display:flex}}

/* 本文は句節改行ではなく両端揃え */
.post .text,.bio,p{text-align:left;line-break:strict;overflow-wrap:anywhere}

/* X 風のモバイルUI */
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.top .bar{position:relative;min-height:53px}
.top .bar .mark{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.top .bar .mark svg{width:26px;height:26px;fill:#0f1419}
.top .bar .ttl{font-size:20px;font-weight:800}
.tabs button{font-weight:500}
.tabs button.on:after{width:auto;left:0;right:0;transform:none;margin:0 auto;max-width:56px}
.bnav{border-top:1px solid var(--line);background:#fff}
.bnav button{width:25%;height:50px}
.bnav button.on svg{fill:#0f1419;stroke:#0f1419}
.fab svg{stroke-width:2.4}
@media(max-width:700px){
  .top .bar{padding:8px 16px}
  .top .bar .ttl{display:none}
  .top .bar .mark{display:block}
  .top .bar .mav{width:34px;height:34px}
  .search{display:none}
  body[data-tab="trend"] .search{display:flex;padding:8px 14px 10px}
  .tabs button[data-tab="notif"]{display:none}
  body[data-tab="notif"] .tabs{display:none}
  .compose,.row{display:none}
  .post{padding:12px 16px 8px}
  .post p{font-size:15px}
  .act{max-width:none;padding-right:8px}
  .act span{padding:4px 2px}
}
.pic-ico{display:inline-block;width:24px;height:24px;background:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat;vertical-align:middle}
.lnav .pic-ico,.bnav .pic-ico{width:26px;height:26px}
.lnav .post .pic-ico,.fab .pic-ico{background:#fff;width:22px;height:22px}
.bnav button.on .pic-ico{background:#0f1419}
.act span .pic-ico{width:18px;height:18px}
.av.icon-av{background-size:60%!important;background-repeat:no-repeat}
.offline{background:#fff3cd;color:#6b5a1e;font-size:14px;padding:8px 14px;border-bottom:1px solid #eadf9f}
.who .badge.pic-ico{width:17px;height:17px;background:var(--blue);border-radius:0}
.who .more.pic-ico{width:18px;height:18px;background:var(--grey);margin-left:auto}
.lnav .logo .pic-ico,.top .bar .mark .pic-ico{background:#0f1419;width:28px;height:28px}
.act .liked .pic-ico{background:#f91880}.act .rted .pic-ico{background:#00ba7c}
.act span .pic-ico{background:var(--grey)}.act span:hover .pic-ico{background:var(--blue)}
.bnav .pic-ico,.lnav .pic-ico{background:var(--grey)}.bnav button.on .pic-ico,.lnav button.on .pic-ico{background:#0f1419}
.pic-ico.fill{width:22px;height:22px}
.who .badge.pic-ico{width:18px;height:18px}
.who .more.pic-ico{width:18px;height:18px;padding:7px;box-sizing:content-box;margin:-7px -7px -7px auto}
.post.pending{opacity:.6}
.offline{background:#f7f9f9;color:#536471;font-size:14px;border-bottom:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;padding:12px 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head .cancel{font-size:15px;color:#0f1419;padding:8px 4px}.sheet-head .post{background:var(--blue);color:#fff;font-weight:700;padding:8px 18px;border-radius:999px;font-size:15px}.sheet-head .post:disabled{opacity:.5}
.sheet textarea{flex:0 0 auto;border:0;outline:none;font:inherit;font-size:19px;min-height:140px;resize:none}
.rcol .u[data-badge="1"] b:after{content:"";display:inline-block;width:14px;height:14px;margin-left:4px;vertical-align:-2px;background:var(--blue);-webkit-mask:url(../assets/img/ui-badge.png) center/contain no-repeat;mask:url(../assets/img/ui-badge.png) center/contain no-repeat}
/* スマホで押しやすく：操作ボタンの当たり判定、FAB とトーストは下部ナビと safe-area を避ける */
@media(max-width:700px){
  .act span{min-height:44px;min-width:44px;padding:4px 6px;justify-content:center;white-space:nowrap}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
</style>
</head>

    const sos = /助け|閉じ込|汐見センター|地下|出られない/.test(p.text);
    p.replies = [];
    // With 代理返信 on, Mi answers under your own name (the same 「via ミー」 as the ghost post).
    if (!miOff) p.replies.push({ u: 'me', via: 'ミー 8.2.1', m: 0, text: 'さっきのは大丈夫。心配しないで' });
    if (sos) { p.replies.push({ u: 'yuki', m: 0, text: miOff ? `@you ${me}？？ 汐見センター？ 今から行く。警察にもかける` : `@you ${me}？？ ミーが返事してるけど、これ本人？` }); if (miOff) store.snsSos = true; }
  }
  // Posts written while offline go out the moment the signal is back.
  if (world.airOn) { let flushed = false; for (const p of store.posts) if (p.pending) { p.pending = false; p.at = Date.now(); deliver(p); flushed = true; } if (flushed) save(); }
  function postClass(p) { return p.pending ? ' pending' : ''; }
  function allPosts() {
    const visible = posts.filter(p => !p.when || world[p.when]);
    const mine = store.posts.map(p => ({ ...p, u: 'me', m: p.pending ? 0 : Math.max(0, Math.floor((Date.now() - p.at) / 60000)), replies: p.replies || [], pending: !!p.pending }));
    // After a bad night, a post in your name that you did not write.
    // After a bad night, a post in your name that you did not write: on the ending screen, and still there the next night.
    const le = world.ending || world.lastEnding; if (['be1', 'be2', 'be3', 'fake'].includes(le)) mine.unshift({ id: 'ghost', u: 'me', m: Math.max(1, Math.floor((Date.now() - (world.lastAt || Date.now())) / 60000)), text: 'ただいま。ミーのおかげで無事です。心配かけてごめんね', via: 'ミー 8.2.1', likes: 4, rts: 0, replies: [{ u: 'kzk', m: 0, text: 'このアカウントって本人が書いてる？' }] });
    return [...mine.reverse(), ...visible].sort((a, b) => a.m - b.m);
  }
  function render() {
    view.replaceChildren();
    if (!world.airOn && !profile) { const off = el('div', 'offline', 'オフライン表示'); view.append(off); }
    document.body.dataset.tab = profile ? 'profile' : tab;
    document.querySelectorAll('.tabs button, .lnav button[data-tab], .bnav button[data-tab]').forEach(bt => bt.classList.toggle('on', bt.dataset.tab === tab && !profile));
    if (profile) {
      const u = users[profile];
      const back = el('a', 'back', '←　' + u.name); back.href = '#'; back.onclick = e => { e.preventDefault(); profile = null; render(); };
      const head = el('div', 'profile'); const cov = el('div', 'cover'); if (u.cover) cov.style.backgroundImage = `url(${u.cover})`; head.append(cov); const inner = el('div', 'in'); head.append(inner);
      const pav = el('div', 'av ' + u.av); if (u.img) pav.style.backgroundImage = `url(${u.img})`; if (u.bg) { pav.style.backgroundColor = u.bg; pav.classList.add('icon-av'); } inner.append(pav, el('button', 'follow', profile === 'me' ? 'プロフィールを編集' : 'フォロー'), el('h2', '', u.name), el('div', 'handle', '@' + u.handle), el('div', 'bio', u.bio), el('div', 'meta', u.meta));
      view.append(back, head);
      const list = allPosts().filter(p => p.u === profile);
      if (!list.length) view.append(el('p', 'quiet', 'まだ投稿がありません'));
      for (const p of list) view.append(wrap(p));
      if (profile === 'nanami') view.append(el('p', 'quiet', 'これ以上の投稿はありません。最終ログイン：1年前'));
      return;
    }
    if (tab === 'home') {
      const c = el('div', 'compose'); c.append(el('div', 'av me'));
      const ta = el('textarea'); ta.placeholder = 'いまどうしてる？'; ta.maxLength = 140; c.append(ta);
      const row = el('div', 'row'); const tools = el('div', 'tools'); tools.innerHTML = ''; row.append(tools); const btn = el('button', '', '投稿する'); btn.disabled = true;
      ta.oninput = () => { btn.disabled = !ta.value.trim(); };
      btn.onclick = () => {
        const text = ta.value.trim(); if (!text) return;
        ta.value = ''; btn.disabled = true; submitPost(text);
      };
      view.append(c, row); row.append(btn);
    }
    if (tab === 'notif') {
      const ghost = ['be1', 'be2', 'be3', 'fake'].includes(world.ending || world.lastEnding);
      const items = [
        ['mi', 'ミー公式があなたをフォローしました', 60 * 24 * 3],
        ...(world.reportedAt ? [['yuki', `ゆきがあなたをメンションしました：「${me}？？？」`, 2]] : []),
        ...(world.reported ? [['mi', 'ミー公式：位置情報の共有をオンにしました（通報・施設への提供）', 12]] : []),
        ...(ghost ? [['kzk', 'かずきがあなたの投稿を引用しました：「このアカウントって本人が書いてる？」', 44]] : [])
      ];
      if (items.length === 1) view.append(el('p', 'quiet', '新しい通知はありません'));
      for (const [u, text, m] of items) { const n = el('div', 'post'); const nav = el('div', 'av ' + users[u].av); if (users[u].img) nav.style.backgroundImage = `url(${users[u].img})`; if (users[u].bg) { nav.style.backgroundColor = users[u].bg; nav.classList.add('icon-av'); } n.append(nav); const b = el('div', 'body'); b.append(el('p', '', text), el('span', 'muted', ago(m))); n.append(b); view.append(n); }
      return;
    }
    let list = allPosts();
    const q = (query || '').trim();
    if (tab === 'trend') list = list.filter(p => /#汐見の窓/.test(p.text) || p.u === 'nanami' || p.alert);
    if (q) list = list.filter(p => (p.text + users[p.u].name + users[p.u].handle).includes(q.replace(/^@/, '')));
    if (!list.length) view.append(el('p', 'quiet', '見つかりませんでした'));
    for (const p of list) view.append(wrap(p));
    view.append(el('p', 'quiet', tab === 'trend' ? 'これ以上の投稿はありません' : '読み込み中…'));
  }
  function wrap(p) {
    if (store.deleted.includes(p.id)) { const d = el('div', 'deleted', 'この投稿は削除されました（投稿者のパートナーAIによる要請）'); return d; }
    const box = document.createDocumentFragment();
    const node = postNode(p); if (p.alert) node.classList.add('alert'); box.append(node);
    if (open === p.id && p.replies?.length) { const r = el('div', 'replies'); for (const rep of p.replies) r.append(postNode(rep, true)); box.append(r); }
    return box;
  }
  document.querySelectorAll('.tabs button').forEach(bt => bt.onclick = () => { tab = bt.dataset.tab; profile = null; render(); });
  document.getElementById('q').oninput = e => { query = e.target.value; profile = null; render(); };
  document.getElementById('me-btn').onclick = () => { profile = 'me'; render(); };
  document.getElementById('me-nav').onclick = () => { profile = 'me'; render(); };
  document.getElementById('me-btn2').onclick = () => { profile = 'me'; render(); };
  document.querySelectorAll('.lnav button[data-tab], .bnav button[data-tab]').forEach(bt => bt.onclick = () => { tab = bt.dataset.tab; profile = null; render(); window.scrollTo(0, 0); });
  function submitPost(text) {
    const online = !!world.airOn;
    store.posts.push({ id: 'me' + Date.now(), text, at: Date.now(), likes: 0, rts: 0, pending: !online }); save(); mark('sns-post');
    toast(online ? '投稿しました' : '送信待ち（圏外）'); tab = 'home'; profile = null; render(); window.scrollTo(0, 0);
    if (online) setTimeout(() => { const last = store.posts[store.posts.length - 1]; if (last && !last.replies) { deliver(last); save(); render(); } }, 9000);
  }
  const goCompose = () => {
    if (window.innerWidth > 700) { tab = 'home'; profile = null; render(); window.scrollTo(0, 0); setTimeout(() => document.querySelector('.compose textarea')?.focus(), 50); return; }
    const sheet = el('div', 'sheet'); const head = el('div', 'sheet-head'); const cancel = el('button', 'cancel', 'キャンセル'); const post = el('button', 'post', '投稿する'); post.disabled = true; head.append(cancel, post);
    const ta = el('textarea'); ta.placeholder = 'いまどうしてる？'; ta.maxLength = 140; ta.oninput = () => { post.disabled = !ta.value.trim(); };
    sheet.append(head, ta); document.body.append(sheet); setTimeout(() => ta.focus(), 50);
    cancel.onclick = () => sheet.remove(); post.onclick = () => { const t = ta.value.trim(); if (!t) return; sheet.remove(); submitPost(t); };
  };
  document.getElementById('fab').onclick = goCompose; document.getElementById('post-nav').onclick = goCompose;
  document.querySelectorAll('.rcol .tr').forEach(t => t.onclick = () => { query = t.dataset.q; document.getElementById('q').value = query; tab = 'trend'; profile = null; render(); });
  document.getElementById('q2').onclick = () => document.getElementById('q').focus();
  for (const id of ['me-btn2', 'me-mav']) { const e = document.getElementById(id); if (users.me.img) e.style.backgroundImage = `url(${users.me.img})`; }
  const sug = document.getElementById('suggest');
  for (const k of ['mi', 'rio', 'kzk']) { const u = users[k]; const row = el('div', 'u'); row.dataset.badge = u.badge ? '1' : ''; const a = el('div', 'av ' + u.av); if (u.img) a.style.backgroundImage = `url(${u.img})`; const t = el('div'); t.append(el('b', '', u.name + (u.badge ? ' ✓' : '')), el('small', '', '@' + u.handle)); const f = el('button', '', k === 'mi' ? 'フォロー中' : 'フォロー'); f.onclick = e => { e.stopPropagation(); f.textContent = f.textContent === 'フォロー' ? 'フォロー中' : 'フォロー'; if (k === 'mi') toast('ミー公式はフォローを解除できません'); }; row.append(a, t, f); row.onclick = () => { profile = k; render(); }; sug.append(row); }
  addEventListener('storage', e => { if (e.key === STORE) { try { store = { ...store, ...(JSON.parse(e.newValue) || {}) }; } catch {} render(); } });
  render();
})();
